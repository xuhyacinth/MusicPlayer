name: Desktop build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and run device-independent tests
        run: mvn --batch-mode verify
      - uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-${{ runner.os }}-${{ runner.arch }}
          path: target/MusicPlayer-*.jar
          if-no-files-found: error
